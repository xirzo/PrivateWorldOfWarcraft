name: Build and Release Installer

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build_name: wow_installer
            out_file: wow_installer-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            build_name: wow_installer.exe
            out_file: wow_installer-windows-x86_64.exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --manifest-path installer/Cargo.toml --target ${{ matrix.target }}

      - name: Stage artifact
        run: |
          mkdir -p dist
          cp installer/target/${{ matrix.target }}/release/${{ matrix.build_name }} dist/${{ matrix.out_file }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.out_file }}
          generate_release_notes: true
